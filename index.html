<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Sai Sriyan Nakka" />
    <meta name="description" content="SmartSaver New Tab" />
    <link rel="icon" href="clock-two-svgrepo-com.png" type="image/png" />
    <title>SS New Tab</title>
    <style>
      @font-face {
        font-family: "Varela Round";
        src: url("VarelaRound-Regular.ttf") format("truetype");
      }
      html {
        background-color: #000;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-size: 62.5%;
        background-color: #000;
        color: white;
        text-align: center;
        overflow: hidden;
      }
      #timeContainer {
        position: absolute;
        visibility: hidden;
        width: max-content;
        cursor: default;
      }
      #mainTime {
        font-family: "Varela Round", sans-serif;
        font-size: 6rem;
        font-weight: 500;
        letter-spacing: -0.05em;
      }
      /* #mainTime .seconds {
        font-size: 0.4em;
        letter-spacing: 0px;
        } */
      #mainTime .seconds {
        position: relative;
        top: -6px;
        line-height: 0;
        margin-left: 0.18em;
        font-size: 0.4em;
        vertical-align: super;
        font-weight: 300;
        letter-spacing: 0px;
      }
      #mainTime #ampm {
        font-size: 0.3em;
        margin-left: 0.05em;
      }
      #monthAndDate {
        font-family: "Varela Round", sans-serif;
        font-size: 1.6rem;
        font-weight: 300;
        margin-top: -0.5em;
      }
      #monthAndDate #year {
        display: block;
        letter-spacing: 4px;
        margin-top: 0.25em;
        font-size: 1.5rem;
        font-weight: 300;
      }
      #timeContainer.fading-out {
        animation: fadeOutShrink 2s ease-in-out forwards;
      }
      #timeContainer.fading-in {
        animation: fadeInGrow 2s ease-in-out forwards;
      }
      /* Animations */
      @keyframes fadeOutShrink {
        from {
          opacity: 1;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(0.8);
        }
      }
      @keyframes fadeInGrow {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes initialFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      #timeContainer.initial-fade-in {
        animation: initialFadeIn 1s ease-in-out forwards;
      }
      .gray {
        color: gray;
      }
    </style>
  </head>
  <body>
    <script src="script.js" defer></script>
    <main>
      <div id="timeContainer">
        <div id="mainTime">
          <span id="hours">0</span
          ><span class="gray" style="font-size: 60px">:</span
          ><span id="minutes">00</span><sup class="seconds gray">:00</sup
          ><span id="ampm" class="gray">AM</span>
        </div>
        <div id="monthAndDate">
          <span id="dayAndDate">Sun, 18 Oct</span>
          <span id="year">2026</span>
        </div>
      </div>
    </main>
  </body>
</html>
